name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python and native Swift
    runs-on: macos-26
    timeout-minutes: 20
    env:
      # The native mirror requires macOS 26; this image includes Xcode 26.3.
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up locked Python environment
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.11"
          python-version: "3.13.11"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Test Python without a device
        run: uv run --frozen python -m unittest discover -s tests -v

      - name: Test and compile native app
        run: |
          swift --version
          swift test
          swift build -c release
